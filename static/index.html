<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mbox Viewer</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header id="app-header">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <polyline points="2,4 12,13 22,4"/>
        </svg>
        Mbox Viewer
    </header>
    <div id="app-container">
        <div id="folders-pane" class="pane">
            <ul id="folder-list"></ul>
        </div>
        <div id="pane-resizer" aria-hidden="true"></div>
        <div id="right-container">
            <div id="emails-pane" class="pane">
                <div id="email-filter">
                    <input type="text" id="filter-string" placeholder="送信元/サブジェクトで検索">
                </div>
                <div id="email-list-box">
                    <table id="email-list">
                        <colgroup>
                            <col class="col-checkbox"/>
                            <col class="col-date"/>
                            <col class="col-from"/>
                            <col class="col-subject"/>
                            <col class="col-delete"/>
                        </colgroup>
                        <thead>
                            <tr>
                                <th><input type="checkbox" id="select-all-checkbox" aria-label="全選択"></th>
                                <th>Date</th>
                                <th>From</th>
                                <th>Subject</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
            <div id="vertical-resizer" aria-hidden="true"></div>
            <div id="content-pane" class="pane">
                <div id="email-content">
                    <p>Select an email to view its content.</p>
                </div>
            </div>
        </div>
    </div>
    <footer id="app-status-bar">
        <span class="status-left">
            <span id="status-mailbox">—</span>
            <span id="status-count">—</span>
        </span>
        <span class="status-right">
            <span id="status-selected">—</span>
        </span>
    </footer>
    <div id="toast-container"></div>
    <div id="confirm-modal-overlay">
        <div id="confirm-modal">
            <p id="confirm-modal-message"></p>
            <div class="confirm-btns">
                <button id="confirm-cancel-btn">キャンセル</button>
                <button id="confirm-ok-btn" class="confirm-primary">削除</button>
            </div>
        </div>
    </div>
    <script src="/static/folder-pane.js"></script>
    <script src="/static/email-list-pane.js"></script>
    <script src="/static/email-content-pane.js"></script>
    <script src="/static/pane-resizers.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
